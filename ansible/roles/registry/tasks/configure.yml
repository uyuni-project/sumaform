---
# Phase configure (salt/registry/init.sls): the container registry as a podman systemd service on port 80.
- name: Registry data directory
  ansible.builtin.file: {path: /var/lib/registry, state: directory, mode: "0755"}

# Generated by Salt's authors via podman generate systemd; KillMode=none replaced by TimeoutStopSec=60
# (https://github.com/containers/podman/pull/8889)
- name: Registry unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Podman container-registry.service
      Documentation=man:podman-generate-systemd(1)
      Wants=network.target
      After=network-online.target

      [Service]
      Environment=PODMAN_SYSTEMD_UNIT=%n
      Restart=on-failure
      ExecStartPre=/bin/rm -f %t/container-registry.pid %t/container-registry.ctr-id
      ExecStart=/usr/bin/podman run --conmon-pidfile %t/container-registry.pid --cidfile %t/container-registry.ctr-id --cgroups=no-conmon -d --replace --name registry --publish 80:5000 -v /var/lib/registry:/var/lib/registry docker.io/library/registry:2
      ExecStop=/usr/bin/podman stop --ignore --cidfile %t/container-registry.ctr-id -t 10
      ExecStopPost=/usr/bin/podman rm --ignore -f --cidfile %t/container-registry.ctr-id
      PIDFile=%t/container-registry.pid
      TimeoutStopSec=60
      Type=forking

      [Install]
      WantedBy=multi-user.target default.target
    dest: /etc/systemd/system/registry.service
    mode: "0644"
  register: _registry_unit

- name: Start the registry
  ansible.builtin.systemd:
    name: registry
    state: "{{ 'restarted' if _registry_unit is changed else 'started' }}"
    enabled: true
    daemon_reload: true
