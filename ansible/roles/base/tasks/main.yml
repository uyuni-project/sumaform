---
# Phase 1, prepare: wait for the first boot to finish, learn what the host is.
- name: Wait for SSH
  ansible.builtin.wait_for_connection:
    timeout: 600

- name: Wait for cloud-init to finish the first boot
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Gather facts
  ansible.builtin.setup:

- name: Detect transactional system (by state, not OS name)
  ansible.builtin.stat:
    path: /usr/sbin/transactional-update
  register: _tu

- name: Remember it
  ansible.builtin.set_fact:
    is_transactional: "{{ _tu.stat.exists }}"

- name: Refuse transactional hosts until the reboot phase exists
  ansible.builtin.assert:
    that: not is_transactional
    fail_msg: "transactional hosts need the reboot step (ticket #123)"

# Phase 3, configure: the basics every host role shares.
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname | default(inventory_hostname) }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  when: timezone is defined

- name: Disable the firewall
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [firewalld, SuSEfirewall2, ufw]
  failed_when: false
  when: disable_firewall | default(true) | bool
