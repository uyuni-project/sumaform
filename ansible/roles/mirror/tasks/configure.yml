---
# Phase configure (salt/mirror/configuration.sls, cron.sls, init.sls).
- name: Create the utils directory
  ansible.builtin.file: {path: /usr/local/bin/utils, state: directory, mode: "0755"}

- name: Download minima
  ansible.builtin.get_url:
    url: https://github.com/uyuni-project/minima/releases/download/v0.25/minima_0.25_linux_amd64.tar.gz
    dest: /var/tmp/minima.tar.gz
    checksum: "sha512:06c2939868bd02b0328d380e04d7e10c194f0e5eec7ddb12c546ba2513942448a169d103147cc31c7faec4bb89ccba139f28692a2bf69f6b650be92de2f229ce"
    mode: "0644"

- name: Unpack minima
  ansible.builtin.unarchive:
    src: /var/tmp/minima.tar.gz
    dest: /usr/local/bin/utils/
    remote_src: true
    creates: /usr/local/bin/utils/minima

- name: Download jdupes
  ansible.builtin.get_url:
    url: https://codeberg.org/jbruchon/jdupes/releases/download/v1.31.1/jdupes-1.31.1-linux-x86_64.pkg.tar.xz
    dest: /var/tmp/jdupes.pkg.tar.xz
    checksum: "sha512:38bdd7d6269d9acb0fad93168a691fb1718651a7de34f1bbd5384b65a23a3d45290adae9e56340dfb0b9d32d2bf261861da75ac44bf4fece64acbfbb18d00c0c"
    mode: "0644"

- name: Unpack jdupes
  ansible.builtin.unarchive:
    src: /var/tmp/jdupes.pkg.tar.xz
    dest: /usr/local/bin/utils/
    remote_src: true
    extra_opts: [--strip-components=3, --wildcards, "*/jdupes"]
    creates: /usr/local/bin/utils/jdupes

- name: Helper scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/utils/{{ item }}"
    mode: "0755"
  loop: [docker_images, adjust_external_repos]

- name: SCC data refresh script
  ansible.builtin.template:
    src: refresh_scc_data.py.j2
    dest: /usr/local/bin/utils/refresh_scc_data.py
    mode: "0755"

# Divergence: Salt read customize_minima_file as a path in the Salt tree. Here it names a template of this role
# (templates/<basename>.j2, e.g. minimum_repositories_testsuite.yaml); the default is minima.yaml.
- name: Minima configuration (SCC credentials inside)
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.template', (customize_minima_file | default('minima.yaml', true) | basename) ~ '.j2') }}"
    dest: /etc/minima.yaml
    mode: "0644"
  no_log: true

- name: Apt mirror configuration
  ansible.builtin.template: {src: apt-mirror.list.j2, dest: /etc/apt-mirror.list, mode: "0644"}

- name: Configuration files of the image scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/{{ item }}"
    mode: "0644"
  loop: [mirror-images.conf, docker-images.conf]

- name: SCC data configuration (credentials inside)
  ansible.builtin.template: {src: scc-data.conf.j2, dest: /etc/scc-data.conf, mode: "0644"}
  no_log: true

- name: Mirroring scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop: [minima.sh, apt-mirror.sh, mirror-images.sh, docker-images.sh, scc-data.sh]

# Partitioning and HTTP serving
- name: Mirror data disk
  ansible.builtin.include_role:
    name: data_disk
    tasks_from: mount
  vars:
    dd_device: "{{ data_disk_device }}"
    dd_mount: /srv/mirror
    dd_fstype: "{{ data_disk_fstype | default('ext4', true) }}"
    dd_mode: "0777"
    dd_owner: wwwrun
    dd_group: users

- name: Apache virtual host
  ansible.builtin.copy: {src: mirror.conf, dest: /etc/apache2/vhosts.d/mirror.conf, mode: "0644"}
  notify: restart mirror apache2

- name: Start apache2
  ansible.builtin.service: {name: apache2, state: started, enabled: true}

# NFS serving
- name: NFS export of the mirror
  ansible.builtin.blockinfile:
    path: /etc/ganesha/ganesha.conf
    marker: "# {mark} sumaform mirror export"
    block: |
      EXPORT
      {
              Export_Id = 1;
              Path = /srv/mirror;
              Pseudo = /srv/mirror;
              Access_Type = RO;
              SecType = None;
              Squash = None;
              FSAL
              {
                      Name = VFS;
              }
      }
  when: nfs_server | default(true) | bool

- name: Start nfs-ganesha
  ansible.builtin.service: {name: nfs-ganesha, state: started, enabled: true}
  when: nfs_server | default(true) | bool

# Cron (salt/mirror/cron.sls); no symlink for docker-images.sh (docker is not installed by default)
- name: Start cron
  ansible.builtin.service: {name: cron, state: started, enabled: true}
  when: not (disable_cron | default(false) | bool)

- name: Daily mirroring jobs
  ansible.builtin.file:
    src: "/usr/local/bin/{{ item }}"
    dest: "/etc/cron.daily/{{ item }}"
    state: link
  loop: [minima.sh, apt-mirror.sh, mirror-images.sh, scc-data.sh]
  when: not (disable_cron | default(false) | bool)

- name: Synchronize the repositories now
  ansible.builtin.command: bash /usr/local/bin/minima.sh
  changed_when: true
  when: synchronize_immediately | default(false) | bool
