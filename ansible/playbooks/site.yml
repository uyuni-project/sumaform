---
# One combined run for one host (run_host.sh limits it to the host). The host's host roles are
# composed once: prepare for all roles, ONE reboot step, configure for all roles, reboot step,
# optional product install, reboot step. Product install is skipped when the testsuite installs the
# product (install_uyuni_via_testsuite) or Salt's skip_server_install is set. The reboot step is a
# no-op unless a snapshot is pending.
# Per-host-role playbooks (minion.yml, ...) import this with only_roles set.
- name: Host roles of the host
  hosts: all
  gather_facts: false
  vars_files: [../host_roles.yml]
  vars:
    _host_roles: "{{ only_roles | default(roles) }}"
    chain_prepare: "{{ _host_roles | map('extract', host_role_chains, 'prepare') | flatten | unique | list }}"
    chain_configure: "{{ _host_roles | map('extract', host_role_chains, 'configure') | flatten | unique | list }}"
    chain_install: "{{ _host_roles | map('extract', host_role_chains, 'install') | flatten | unique | list }}"
    # host roles whose configure includes the ssh_keypair role (directly or from their own role)
    keypair_roles: [controller, build_host, proxy_containerized, server_kubernetes, proxy_kubernetes]
  tasks:
    # TODO(#126): Terraform does not generate the per-deployment keypair yet. Fail here, before any change
    # to the host, instead of at the ssh_keypair task after prepare and a reboot. Name is the message (no_log).
    - name: "Missing host_vars ssh_private_key and ssh_public_key on {{ inventory_hostname }} (not generated by Terraform yet, see ansible/SMOKE_TODO.md)"
      ansible.builtin.assert:
        that:
          - ssh_private_key | default('') | length > 0
          - ssh_public_key | default('') | length > 0
      when: _host_roles | intersect(keypair_roles) | length > 0
      no_log: true

    - name: Phase prepare
      block:
        - ansible.builtin.include_role: {name: base, tasks_from: prepare}
        - ansible.builtin.include_role: {name: transactional, tasks_from: setup}
        - ansible.builtin.include_role: {name: repos}   # the first boot has no repos
        - ansible.builtin.include_role: {name: "{{ item }}", tasks_from: prepare}
          loop: "{{ chain_prepare }}"

    - name: Reboot step (prepare to configure)
      ansible.builtin.include_role: {name: transactional, tasks_from: reboot}

    - name: Phase configure
      block:
        - ansible.builtin.include_role: {name: base, tasks_from: configure}
        - ansible.builtin.include_role: {name: "{{ item }}", tasks_from: configure}
          loop: "{{ chain_configure }}"

    - name: Reboot step (end of configure)
      ansible.builtin.include_role: {name: transactional, tasks_from: reboot}

    - name: Phase product install (optional)
      when: &install_when "not (install_uyuni_via_testsuite | default(false) | bool or skip_server_install | default(false) | bool)"
      block:
        - ansible.builtin.include_role: {name: "{{ item }}", tasks_from: install}
          loop: "{{ chain_install }}"

    - name: Reboot step (end of product install)
      ansible.builtin.include_role: {name: transactional, tasks_from: reboot}
      when: *install_when
