name: Mirror update notification

on:
  pull_request:
    branches:
      - master
    paths:
      - backend_modules/libvirt/base/main.tf

jobs:
  check-image-urls:
    name: Check updated image URLs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        fetch-depth: 2
    - name: Find modified image URLs
      run: |
        echo "IMAGE_LIST<<EOF" >> $GITHUB_ENV

        git diff -p -U0 --no-color --diff-filter=M -G"\{var\.mirror\}" \
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} \
          -- backend_modules/libvirt/base/main.tf | \
          grep "^[+-] " | sed 's/^[+-]\s*\([^ ]*\).*$/ - `\1`/' | uniq >> $GITHUB_ENV

        echo "EOF" >> $GITHUB_ENV
    - name: Warn about updated image URLs
      run: |
        if [ -z "${IMAGE_LIST}" ]; then
          exit 0
        fi

        echo "::warning title=Image URLs updated::This pull request updates the URLs of the following images: $(echo "${IMAGE_LIST}" | sed 's/^ - //' | paste -sd, -). Please consider updating the CI and BV mirror configurations accordingly."

        {
          echo "This pull request updates the URLs of the following images:"
          echo "${IMAGE_LIST}"
          echo
          echo "Please consider updating the CI and BV mirror configurations accordingly."
        } >> "$GITHUB_STEP_SUMMARY"
