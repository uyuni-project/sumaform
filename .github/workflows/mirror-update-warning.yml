name: Mirror update notification

on:
  pull_request:
    branches:
      - master
    paths:
      - backend_modules/libvirt/base/main.tf

jobs:
  check-image-urls:
    name: Check updated image URLs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        fetch-depth: 2
    - name: Find modified image URLs
      run: |
        echo "IMAGE_LIST<<EOF" >> $GITHUB_ENV

        git diff -p -U0 --no-color --diff-filter=M -G"\{var\.mirror\}" \
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} \
          -- backend_modules/libvirt/base/main.tf | \
          grep "^[+-] " | sed 's/^[+-]\s*\([^ ]*\).*$/ - `\1`/' | uniq >> $GITHUB_ENV

        echo "EOF" >> $GITHUB_ENV
    - name: Comment on the pull request
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        MARKER: "<!-- mirror-update-warning -->"
      run: |
        comment_id=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate \
          --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- mirror-update-warning -->") or startswith("This pull request updates the URLs"))][0].id // empty')

        if [ -z "${IMAGE_LIST}" ]; then
          if [ -n "${comment_id}" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${comment_id}"
          fi
          exit 0
        fi

        body="${MARKER}
        This pull request updates the URLs of the following images:
        ${IMAGE_LIST}

        Please consider updating the CI and BV mirror configurations accordingly."

        if [ -n "${comment_id}" ]; then
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${comment_id}" -f body="${body}"
        else
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="${body}"
        fi
